# CHR-204 WorkMate-owned Rakazo overlay. It is deliberately not the upstream
# public product Compose file and must never be used for Chris's /opt/rakazo
# personal deployment.
name: workmate-rakazo

services:
  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        GIT_SHA: ${RAKAZO_GIT_SHA:?Set the WorkMate Rakazo revision}
    command: ["pnpm", "--filter", "@rakazo/api", "start"]
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m
    env_file:
      - ${WORKMATE_RAKAZO_ENV_FILE:?Set an operator-owned environment file outside this checkout}
    environment:
      NODE_ENV: production
      RAKAZO_INTEGRATION_MODE: workmate
      API_PORT: 3100
      DATA_DIR: /data
      COREPACK_HOME: /tmp/corepack
      SANDBOX_PROVIDER: e2b
      AGENT_RUNTIME: pi
      WAKEUP_DRIVER: graphile
      RAKAZO_GIT_SHA: ${RAKAZO_GIT_SHA:?Set the WorkMate Rakazo revision}
    ports:
      - "127.0.0.1:23100:3100"
    volumes:
      - workmate_rakazo_data:/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        GIT_SHA: ${RAKAZO_GIT_SHA:?Set the WorkMate Rakazo revision}
    command: ["pnpm", "--filter", "@rakazo/worker", "start"]
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 2g
    env_file:
      - ${WORKMATE_RAKAZO_ENV_FILE:?Set an operator-owned environment file outside this checkout}
    environment:
      NODE_ENV: production
      RAKAZO_INTEGRATION_MODE: workmate
      DATA_DIR: /data
      COREPACK_HOME: /tmp/corepack
      SANDBOX_PROVIDER: e2b
      AGENT_RUNTIME: pi
      WAKEUP_DRIVER: graphile
    volumes:
      - workmate_rakazo_data:/data
    tmpfs:
      - /tmp

  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        GIT_SHA: ${RAKAZO_GIT_SHA:?Set the WorkMate Rakazo revision}
    command: ["pnpm", "--filter", "@rakazo/web", "preview", "--host", "0.0.0.0", "--port", "5173"]
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    env_file:
      - ${WORKMATE_RAKAZO_ENV_FILE:?Set an operator-owned environment file outside this checkout}
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:3100
      RAKAZO_HOST: workmateos.co.uk
      COREPACK_HOME: /tmp/corepack
    ports:
      - "127.0.0.1:25173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  workmate_rakazo_data:
    name: workmate_rakazo_data
